<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고정팟 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFF6; --surface:#FFFFFF; --ink:#1E2238; --muted:#6A7090; --line:#D8DBE9;
    --m0:#14958A; --m1:#7556D3; --m2:#C98B00;
    --sat:#3D6FD6; --sun:#D24A5A;
    --full-bg:#1E2238; --full-ink:#FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131624; --surface:#1C2033; --ink:#E7E9F5; --muted:#9298B8; --line:#2D3250;
      --m0:#3CC2B4; --m1:#A08BF0; --m2:#F0B935;
      --sat:#7FA4F0; --sun:#F07E8B;
      --full-bg:#E7E9F5; --full-ink:#131624;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:16px; line-height:1.5;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  main{max-width:560px; margin:0 auto; padding:28px 18px 60px}
  h1,h2{font-family:"Do Hyeon","Gowun Dodum",sans-serif; font-weight:400; margin:0}
  h1{font-size:2.1rem; line-height:1.1; letter-spacing:-.01em}
  h2{font-size:1.25rem}
  .sub{color:var(--muted); margin:6px 0 18px}
  button{font:inherit; color:inherit; cursor:pointer}
  button:focus-visible{outline:3px solid var(--m1); outline-offset:2px}

  /* 나는 누구 */
  .who{display:flex; gap:8px; flex-wrap:wrap}
  .who button{
    border:2px solid var(--line); background:var(--surface); border-radius:999px;
    padding:8px 16px 8px 10px; display:flex; align-items:center; gap:8px;
  }
  .who .dot{width:14px; height:14px; border-radius:50%}
  .who button[aria-checked="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
  .who.nudge{animation:nudge .5s}
  @keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .who-label{font-size:.9rem; color:var(--muted); margin:0 0 6px}

  .note{margin:18px 0 0; padding:10px 14px; border-radius:10px; background:var(--surface); border:1px dashed var(--line); color:var(--muted); font-size:.92rem}

  /* 셋 다 되는 시간 */
  .upcoming{margin-top:30px}
  .uplist{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 6px; scrollbar-width:thin}
  .upchip{
    flex:0 0 auto; border:0; border-radius:12px; padding:10px 14px; text-align:left;
    background:var(--full-bg); color:var(--full-ink);
  }
  .upchip small{display:block; opacity:.75; font-size:.8rem}
  .empty{color:var(--muted); font-size:.95rem; padding:8px 0}

  /* 날짜 */
  .dates{display:flex; gap:6px; overflow-x:auto; margin:26px -18px 0; padding:4px 18px 10px; scrollbar-width:thin}
  .date{
    flex:0 0 56px; border:1px solid var(--line); background:var(--surface); border-radius:14px;
    padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .date .wd{font-size:.8rem; color:var(--muted)}
  .date.sat .wd{color:var(--sat)} .date.sun .wd{color:var(--sun)}
  .date .dn{font-family:"Do Hyeon",sans-serif; font-size:1.35rem; line-height:1}
  .date .mk{font-size:.7rem; height:1.1em; color:var(--muted)}
  .date .mk.on{color:var(--ink); font-weight:700}
  .date[aria-current="date"]{border-color:var(--ink); border-width:2px; padding:7px 0 5px}

  /* 하루 */
  .day{margin-top:18px; background:var(--surface); border-radius:18px; padding:18px 14px 10px; border:1px solid var(--line)}
  .dayhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:0 4px}
  .dayactions{display:flex; gap:6px}
  .dayactions button{border:1px solid var(--line); background:transparent; border-radius:8px; padding:5px 10px; font-size:.85rem}
  .fixed{margin:12px 4px 0; padding:8px 12px; border-radius:10px; background:var(--full-bg); color:var(--full-ink); font-size:.95rem}
  .legend{display:flex; gap:12px; margin:12px 4px 4px; font-size:.82rem; color:var(--muted)}
  .legend span{display:flex; align-items:center; gap:5px}
  .legend i{width:10px; height:10px; border-radius:50%; display:inline-block}

  ol.slots{list-style:none; margin:6px 0 0; padding:0}
  .slots li{display:flex; align-items:stretch; gap:6px; border-top:1px solid var(--line)}
  .slots li:first-child{border-top:0}
  .slot{
    flex:1; display:grid; grid-template-columns:5.6em 1fr auto; align-items:center; gap:10px;
    border:0; background:transparent; padding:11px 6px; text-align:left; border-radius:10px; margin:2px 0;
  }
  .slot:disabled{opacity:.38; cursor:default}
  .t{font-family:"Do Hyeon",sans-serif; font-size:1.05rem}
  .t.late{color:var(--muted)}
  .pills{display:flex; gap:5px}
  .pill{
    min-width:2.1em; height:1.7em; padding:0 6px; border-radius:7px; font-size:.75rem;
    display:grid; place-items:center; border:1.5px solid var(--line); color:var(--muted);
  }
  .pill.on{color:#fff; border-color:transparent}
  @media (prefers-color-scheme: dark){ .pill.on{color:#131624} }
  .pill.me{outline:2px solid var(--ink); outline-offset:1px}
  .state{font-size:.8rem; color:var(--muted); white-space:nowrap}

  .slots li.full .slot{background:var(--full-bg); color:var(--full-ink)}
  .slots li.full .t.late, .slots li.full .state{color:var(--full-ink); opacity:.8}
  .slots li.full .pill:not(.on){border-color:var(--full-ink)}
  .slots li.full .pill.me{outline-color:var(--full-ink)}
  .pin{
    flex:0 0 44px; border:1px solid var(--line); background:transparent; border-radius:10px; margin:2px 0;
    font-size:1.1rem; display:grid; place-items:center;
  }
  .pin[aria-pressed="true"]{background:var(--full-bg); border-color:var(--full-bg)}

  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.92rem;
    max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1}
  @media (prefers-reduced-motion: reduce){ .who.nudge{animation:none} .toast{transition:none} }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">고정팟 일정</h1>
    <p class="sub">되는 시간을 눌러두면 셋 다 겹치는 시간이 진하게 표시돼요.</p>
    <p class="who-label">나는</p>
    <div class="who" id="who" role="radiogroup" aria-label="나는 누구"></div>
    <p class="note" id="modeNote" hidden></p>
  </header>

  <section class="upcoming" aria-labelledby="upTitle">
    <h2 id="upTitle">셋 다 되는 시간</h2>
    <div class="uplist" id="upList"></div>
  </section>

  <nav class="dates" id="dates" aria-label="날짜 선택"></nav>

  <section class="day">
    <div class="dayhead">
      <h2 id="dayTitle"></h2>
      <div class="dayactions">
        <button id="allBtn" type="button">이 날 전부 가능</button>
        <button id="clearBtn" type="button">비우기</button>
      </div>
    </div>
    <div id="fixedNote"></div>
    <div class="legend" id="legend"></div>
    <ol class="slots" id="slots"></ol>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Firebase (실시간 공유 저장소) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================== 여기만 고치면 돼요 ================== */
const CONFIG = {
  partyName: "레타 고정팟",
  partyId: "reta-party-7k2q",     // 아무 영문·숫자 조합으로 바꿔두기 (링크 모르는 사람이 못 찾게)
  members: ["레타", "팟원2", "팟원3"], // 팟원 이름 (순서 바꾸지 말기)
  startHour: 12,                  // 12시부터
  endHour: 26,                    // 26 = 새벽 2시까지
  days: 14,                       // 오늘부터 며칠 보여줄지
};

// Firebase 콘솔에서 복사한 설정을 그대로 붙여넣기
const firebaseConfig = {
  apiKey: "여기에_붙여넣기",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* ======================================================= */

const COLORS = ["var(--m0)", "var(--m1)", "var(--m2)"];
const WD = ["일","월","화","수","목","금","토"];
const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateKeys = [];
(() => {
  const base = new Date();
  if (base.getHours() < 4) base.setDate(base.getDate()-1); // 새벽 4시 전이면 아직 '어제' 게임일
  for (let i=0;i<CONFIG.days;i++){ const d=new Date(base); d.setDate(base.getDate()+i); dateKeys.push(keyOf(d)); }
})();
const HOURS = []; for (let h=CONFIG.startHour; h<CONFIG.endHour; h++) HOURS.push(h);

const hourLabel = h => h < 24 ? `${h}시` : `새벽 ${h-24}시`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const dateLabel = k => { const d=parseKey(k); return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`; };

function isPast(k,h){
  if (k !== dateKeys[0]) return false;
  const now = new Date(); let cur = now.getHours(); if (cur < 4) cur += 24;
  return h < cur;
}

/* ---------- 저장소 ---------- */
let data = { avail:{}, fixed:{} };
let store;

function makeLocalStore(){
  const KEY = "partyplan-demo-" + CONFIG.partyId;
  try { data = JSON.parse(localStorage.getItem(KEY)) || data; } catch(e){}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} render(); };
  const ensure = (d,m) => { data.avail[d] ??= {}; data.avail[d]["m"+m] ??= {}; return data.avail[d]["m"+m]; };
  return {
    setSlot(d,m,h,v){ const o=ensure(d,m); if(v) o["h"+h]=true; else delete o["h"+h]; save(); },
    setDay(d,m,hours){ data.avail[d] ??= {}; data.avail[d]["m"+m] = hours; save(); },
    setFixed(d,h){ if(h==null) delete data.fixed[d]; else data.fixed[d]=h; save(); }
  };
}

function makeFirebaseStore(){
  firebase.initializeApp(firebaseConfig);
  const root = firebase.database().ref("parties/" + CONFIG.partyId);
  const fail = e => toast("저장소에 연결하지 못했어요. Firebase 규칙과 설정을 확인해 주세요.");
  root.child("avail").orderByKey().startAt(dateKeys[0]).on("value", s => { data.avail = s.val() || {}; render(); }, fail);
  root.child("fixed").orderByKey().startAt(dateKeys[0]).on("value", s => { data.fixed = s.val() || {}; render(); }, fail);
  const w = p => p.catch(fail);
  return {
    setSlot:(d,m,h,v) => w(root.child(`avail/${d}/m${m}/h${h}`).set(v ? true : null)),
    setDay:(d,m,hours) => w(root.child(`avail/${d}/m${m}`).set(hours)),
    setFixed:(d,h) => w(root.child(`fixed/${d}`).set(h ?? null))
  };
}

const useFirebase = typeof firebase !== "undefined" && firebaseConfig.databaseURL && !firebaseConfig.apiKey.includes("여기에");
if (useFirebase) {
  store = makeFirebaseStore();
} else {
  store = makeLocalStore();
  const n = $("#modeNote"); n.hidden = false;
  n.textContent = "연습 모드예요. 지금은 이 기기에만 저장되고, Firebase 설정을 넣으면 팟원끼리 공유돼요.";
}

/* ---------- 상태 ---------- */
let me = null;
try { const v = localStorage.getItem("partyplan-me-" + CONFIG.partyId); if (v !== null) me = Number(v); } catch(e){}
let current = dateKeys[0];

const has = (d,m,h) => !!data.avail?.[d]?.["m"+m]?.["h"+h];
const countAt = (d,h) => CONFIG.members.reduce((n,_,m) => n + (has(d,m,h)?1:0), 0);
const isFull = (d,h) => countAt(d,h) === CONFIG.members.length;

function fullRanges(d){
  const out=[]; let s=null;
  HOURS.forEach((h,i) => {
    const ok = isFull(d,h) && !isPast(d,h);
    if (ok && s===null) s=h;
    if ((!ok || i===HOURS.length-1) && s!==null){ out.push([s, ok ? h+1 : h]); s=null; }
  });
  return out;
}

/* ---------- 그리기 ---------- */
function renderWho(){
  const box = $("#who"); box.innerHTML = "";
  CONFIG.members.forEach((name,m) => {
    const b = document.createElement("button");
    b.type="button"; b.setAttribute("role","radio"); b.setAttribute("aria-checked", String(me===m));
    b.innerHTML = `<span class="dot" style="background:${COLORS[m]}"></span>`;
    b.append(name);
    b.onclick = () => { me=m; try{localStorage.setItem("partyplan-me-"+CONFIG.partyId, m);}catch(e){} render(); };
    box.append(b);
  });
}

function renderUpcoming(){
  const box = $("#upList"); box.innerHTML = "";
  const items = [];
  dateKeys.forEach(d => {
    const fx = data.fixed?.[d];
    if (fx != null) items.push({d, text:`${hourLabel(fx)}부터`, fixed:true});
    else fullRanges(d).forEach(([a,b]) => items.push({d, text:`${hourLabel(a)}–${hourLabel(b)}`}));
  });
  if (!items.length){
    const p=document.createElement("p"); p.className="empty";
    p.textContent = "아직 셋 다 겹치는 시간이 없어요. 각자 되는 시간을 눌러주세요.";
    box.append(p); return;
  }
  items.slice(0,10).forEach(it => {
    const b=document.createElement("button"); b.type="button"; b.className="upchip";
    const sm=document.createElement("small"); sm.textContent = dateLabel(it.d) + (it.fixed ? " · 📌 확정" : "");
    b.append(sm, it.text);
    b.onclick = () => { current=it.d; render(); $(".day").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto":"smooth", block:"start"}); };
    box.append(b);
  });
}

function renderDates(){
  const box=$("#dates"); box.innerHTML="";
  dateKeys.forEach((k,i) => {
    const d=parseKey(k), wd=d.getDay();
    const b=document.createElement("button"); b.type="button";
    b.className = "date" + (wd===6?" sat":"") + (wd===0?" sun":"");
    if (k===current) b.setAttribute("aria-current","date");
    const n = HOURS.filter(h => isFull(k,h) && !isPast(k,h)).length;
    const fx = data.fixed?.[k] != null;
    b.innerHTML = `<span class="wd">${i===0?"오늘":WD[wd]}</span><span class="dn">${d.getDate()}</span><span class="mk${(fx||n)?" on":""}">${fx?"📌":(n?n+"시간":"")}</span>`;
    b.setAttribute("aria-label", `${dateLabel(k)}${fx?", 확정됨":n?`, 셋 다 ${n}시간`:""}`);
    b.onclick = () => { current=k; render(); };
    box.append(b);
  });
  box.querySelector('[aria-current="date"]')?.scrollIntoView({inline:"nearest", block:"nearest"});
}

function renderDay(){
  $("#dayTitle").textContent = dateLabel(current);
  const fx = data.fixed?.[current];
  $("#fixedNote").innerHTML = fx!=null ? `<div class="fixed">📌 이 날 ${hourLabel(fx)}에 모이기로 했어요</div>` : "";

  $("#legend").innerHTML = CONFIG.members.map((n,m)=>`<span><i style="background:${COLORS[m]}"></i>${escapeHtml(n)}</span>`).join("");

  const ol=$("#slots"); ol.innerHTML="";
  HOURS.forEach(h => {
    const li=document.createElement("li");
    const full=isFull(current,h), past=isPast(current,h);
    if (full && !past) li.className="full";

    const b=document.createElement("button"); b.type="button"; b.className="slot";
    b.disabled = past;
    const mine = me!==null && has(current,me,h);
    b.setAttribute("aria-pressed", String(mine));
    const cnt=countAt(current,h);
    const pills = CONFIG.members.map((name,m)=>{
      const on=has(current,m,h);
      return `<span class="pill${on?" on":""}${m===me?" me":""}" style="${on?`background:${COLORS[m]}`:""}">${escapeHtml(name.slice(0,2))}</span>`;
    }).join("");
    b.innerHTML = `<span class="t${h>=24?" late":""}">${hourLabel(h)}</span><span class="pills">${pills}</span><span class="state">${full?"셋 다 가능":cnt?`${cnt}명`:""}</span>`;
    b.setAttribute("aria-label", `${hourLabel(h)}, ${cnt}명 가능${mine?", 나도 가능":""}`);
    b.onclick = () => {
      if (me===null){ needMe(); return; }
      store.setSlot(current, me, h, !mine);
    };
    li.append(b);

    if (full && !past){
      const p=document.createElement("button"); p.type="button"; p.className="pin";
      const pinned = fx===h;
      p.setAttribute("aria-pressed", String(pinned));
      p.setAttribute("aria-label", pinned ? `${hourLabel(h)} 확정 취소` : `${hourLabel(h)}로 확정`);
      p.textContent = "📌";
      p.onclick = () => { store.setFixed(current, pinned ? null : h); toast(pinned ? "확정을 취소했어요" : `${dateLabel(current)} ${hourLabel(h)}로 확정했어요`); };
      li.append(p);
    }
    ol.append(li);
  });
}

function render(){ renderWho(); renderUpcoming(); renderDates(); renderDay(); }

/* ---------- 버튼 ---------- */
$("#allBtn").onclick = () => {
  if (me===null){ needMe(); return; }
  const o={}; HOURS.forEach(h => { if(!isPast(current,h)) o["h"+h]=true; });
  store.setDay(current, me, o);
};
$("#clearBtn").onclick = () => {
  if (me===null){ needMe(); return; }
  store.setDay(current, me, null);
};

function needMe(){
  const w=$("#who"); w.classList.remove("nudge"); void w.offsetWidth; w.classList.add("nudge");
  toast("먼저 위에서 나를 골라주세요");
  w.scrollIntoView({block:"center"});
}
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

$("#title").textContent = CONFIG.partyName;
document.title = CONFIG.partyName + " 일정";
render();
setInterval(render, 5*60*1000); // 지난 시간 자동 정리
</script>
</body>
</html>
